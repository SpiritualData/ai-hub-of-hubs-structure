# esoi configuration for ai-hub-of-hubs-structure.
package = "hubofhubs"
layers = ["core"]
other_layers = ["docs", "tests", "scripts", "examples", "evaluation"]
max_lines = 1500

# Evaluation: one component folder per seat under evaluation/ (cases.json, score.py, impls/), results and per-case logs beside the records.
# The measured code is the package without the critique module (no seat measured here uses it), so an unrelated edit there does not
# make a result stale; docs are not code.
# Arms that may spend money: never run by `esoi run --stale` without --include-paid (esoi harness.paid_reason).
paid_arms = ["cards_from_files/llm_topic_cards"]
evaluation_dir = "evaluation"
results = "esoi/results.csv"
# The coverage of the whole assembly is recorded by `esoi run assemble_the_whole --impl zero_config --record`; the solution has no arm to select, so it is a shared
# evaluation folder and not the command of a metric.
shared_eval_dirs = ["__pycache__", "assemble_the_whole"]
# The records beside the code (see [records] beside_code) are not measured code either.
code_paths = ["hubofhubs", "evaluation", ":(exclude)hubofhubs/critique", ":(exclude,glob)**/*.md", ":(exclude,glob)hubofhubs/**/problems.csv",
              ":(exclude,glob)hubofhubs/**/ideals.csv", ":(exclude,glob)hubofhubs/**/solutions.csv", ":(exclude,glob)hubofhubs/**/implementations.csv",
              ":(exclude,glob)hubofhubs/**/metrics.csv"]

[records]
template_version = 4
# Each solution's records live once, in the folder that holds its code (docs/reference/records-beside-code.md in the esoi repository).
# The top intent stays in esoi/; `esoi records place --apply` moves records here, `esoi readmes` writes the page of each folder.
beside_code = ["hubofhubs", "hubofhubs/*"]
# The code folders of the arms (hubofhubs/models, recall, ...) hold no records: the records of their solutions are in the sub-intent folders
# (hubofhubs/the_self, the_body, the_intelligence, the_world, the_consciousness). `esoi readmes` writes the page of each arm folder.
arm_folders = ["hubofhubs/*"]

# Public evidence: others' measurements, shown beside our own results and never counted as one. The registry
# hubofhubs/registry/hub_evidence.csv is the one source of truth; esoi/evidence.csv is derived from it by
# scripts/export_evidence.py (a test fails when they differ). The default file is esoi/evidence.csv, named here for clarity.
[evidence]
file = "esoi/evidence.csv"

# candidate (as the evidence names it) to the hub implementation it measures. Only where the match is honest: the hub's bm25 arm
# is built on the bm25s library, and its stream-json goal runner drives the Claude Code CLI over stream-json.
[evidence.aliases]
"bm25s" = "bm25"
"Claude Code CLI (claude -p stream-json)" = "stream_json_goal_runner"

# The balanced score of act-in-the-world's file-edit check (esoi/balance.py): accuracy 70%, cost 15%, time 15%. Arms of this seat reach
# nearly the same pass rate at very different prices (one model call in about 2.5 s for half a cent against a Claude Code session in about
# 20 s for about fifteen cents), so cost and speed count through the metric and not through a separate rule. A small file edit is worth at
# most ten cents and a minute; an arm that spends the whole of either gets zero for it. The weights are the library's defaults, not fitted to
# these results. The Claude Code runners run on a subscription: their dollars are the CLI's own estimate at list price, counted as cost here.
[balance.file_edit_goals]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.10
seconds_per_case = 60

# The balanced score of cards-from-files (esoi/balance.py). One case is finding the file one task needs, which is part of a
# small file edit (worth at most ten cents and a minute, [balance.file_edit_goals]) and what a worker without cards spends a
# few tool calls on, so a case is worth at most a fifth of an edit. One build serves every case of a run, so a card build of
# this corpus is worth at most the file-finding cases' budget. The weights and budgets were fixed before any arm was scored on the
# mixed set and are not tuned on its results: accuracy counts most because a wrong card costs the reader more than a build costs the
# team; cost and time are equal and small because a build is paid once per corpus. The case mix (file, topic, orientation) is
# evaluation/cards_from_files/mix.py and the store-size term is applied to the accuracy inside the scorer (score.store_penalty), since
# the library's balanced score has three terms.
[balance.cards_from_files]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.02
seconds_per_case = 12

# The balanced scores of the three cascades that pool several kinds of case into one component (esoi/balance.py, docs/how-to/
# write-a-cascade-that-stays-one-number.md). Weights are the library's defaults; the budgets say what one case is worth at most and are
# fixed before any arm is scored on the pooled set, not tuned on its results. The kinds of case (know-the-world: LitSearch questions;
# watch-for-risk: explicit and ambiguous step digests; context-assembler: public medical queries, title or sentence queries over a paper
# sample, paraphrased queries over the same sample) are case sources of one component each, mixed by the table in the component's own
# mix module, never separate stages or leaderboards.
#
# know-the-world: one paper lookup is worth at most a cent and half a minute; the paid arms spend about a hundredth of that in money
# and a few seconds.
[balance.know_the_world]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.01
seconds_per_case = 30

# watch-for-risk: the check runs before steps of a run, so one verdict is worth at most half a cent and ten seconds.
[balance.watch_for_risk]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.005
seconds_per_case = 10

# context-assembler: one retrieval runs per query and its embedding is the only money spent, so a query is worth at most half a cent and
# five seconds.
[balance.context_assembler]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.005
seconds_per_case = 5

# Opt-in rules (esoi/docs): S36 the overall network on the root solution, S37 every id has an interface and a one-line entry,
# S38 the paragraph and diagram match the code, S39 the ratchet against the base commit. S38 floors are per intent, set at the measured values.
[rules.S36]
enabled = true

[rules.S37]
enabled = true

[rules.S38]
enabled = true

# Coverage is the share of the top intent's uses edges whose two ends both have code. The edges from The Self to the containers Body, Intelligence and
# Consciousness end in specifications that no arm carries out yet (the records say so), so the floor is the measured value and not 1.0.
[rules.S38.floors.hub-of-hubs]
precision = 1.0
coverage = 0.25

[rules.S39]
enabled = true

# context-retrieval: one retrieval is worth at most half a cent and two seconds (a keyword search costs nothing and a local embedding of the
# query a few hundredths of a second; a model reranker costs a few tenths of a cent and a few seconds). The weights are the library's defaults,
# fixed with the budgets before any arm was scored on the mix of evaluation/context_retrieval/mix.py; the store size is a term of the accuracy
# (score.store_penalty), as in cards-from-files, because the library's balanced score has three terms.
[balance.context_retrieval]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.005
seconds_per_case = 2
