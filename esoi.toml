# esoi configuration for ai-hub-of-hubs-structure.
package = "hubofhubs"
layers = ["core"]
other_layers = ["docs", "tests", "scripts", "evaluation"]
max_lines = 1500
root_python_allow = ["conftest.py"]   # the one shared pytest conftest serves tests/ and the tests/ folders beside each solution

# Evaluation: one component folder per seat under evaluation/ (cases.json, score.py, impls/), results and per-case logs beside the records.
# The measured code is the package; docs are not code.
# Arms that may spend money: never run by `esoi run --stale` without --include-paid (esoi harness.paid_reason).
paid_arms = ["cards_from_files/llm_topic_cards", "goal_completion/fast_tier_stop"]
evaluation_dir = "evaluation"
results = "esoi/results.csv"
# The coverage of the whole assembly is recorded by `esoi run assemble_the_whole --impl zero_config --record`; the solution has no arm to select, so it is a shared
# evaluation folder and not the command of a metric.
shared_eval_dirs = ["__pycache__", "assemble_the_whole"]
# The records beside the code (see [records] beside_code) are not measured code either.
code_paths = ["hubofhubs", "evaluation", ":(exclude,glob)**/*.md", ":(exclude,glob)hubofhubs/**/problems.csv",
              ":(exclude,glob)hubofhubs/**/ideals.csv", ":(exclude,glob)hubofhubs/**/solutions.csv", ":(exclude,glob)hubofhubs/**/implementations.csv",
              ":(exclude,glob)hubofhubs/**/metrics.csv", ":(exclude,glob)hubofhubs/**/knowledge.csv"]

[records]
template_version = 4
# Each solution's records live once, in the folder that holds its code (docs/reference/records-beside-code.md in the esoi repository).
# The top intent stays in esoi/; `esoi records place --apply` moves records here, `esoi readmes` writes the page of each folder.
beside_code = ["hubofhubs", "hubofhubs/*", "hubofhubs/*/*", "hubofhubs/*/*/*", "hubofhubs/*/*/*/*"]
# A folder of helper code that sits below a solution's folder and holds no records of its own (run_store, assemblers, overseer, ...) is covered by
# a page `esoi readmes` writes. Folders: the five containers, a second-level solution, a third-level solution, and the helpers below them.
arm_folders = ["hubofhubs/*", "hubofhubs/*/*", "hubofhubs/*/*/*", "hubofhubs/*/*/*/*", "hubofhubs/*/*/*/*/*"]

# Public evidence: others' measurements, shown beside our own results and never counted as one. The registry
# hubofhubs/registry/hub_evidence.csv is the one source of truth; esoi/evidence.csv is derived from it by
# scripts/export_evidence.py (a test fails when they differ). The default file is esoi/evidence.csv, named here for clarity.
# Per-solution consideration (esoi spec prompt / esoi consider, the hub's relevant-solutions and solution-passes): the researched findings join the
# prompt of the solution each row names (its solution_id: the solution whose arm implements the candidate, else the seat of its area in hubs.csv),
# and each row cites that solution's recorded results in its results column (filled from esoi/results.csv, or "no recorded results").
[[consider.records]]
file = "hubofhubs/registry/hub_findings.csv"
kind = "finding"
results = "results"

[evidence]
file = "esoi/evidence.csv"

# candidate (as the evidence names it) to the hub implementation it measures. Only where the match is honest: the hub's bm25 arm
# is built on the bm25s library, and its stream-json goal runner drives the Claude Code CLI over stream-json.
[evidence.aliases]
"bm25s" = "bm25"
"Claude Code CLI (claude -p stream-json)" = "stream_json_goal_runner"

# The balanced score of the file-edit check (esoi/balance.py), measured for File Editing only (single-file coding edits): accuracy 70%, cost 15%, time 15%. A small
# file edit is worth at most ten cents and a minute; an arm that spends the whole of either gets zero for it. The weights are the library's defaults, not fitted to
# these results. Delegated Agent Sessions has its own score below: an agent session is not a file edit and shares no case set with it.
[balance.file_edit_goals]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.10
seconds_per_case = 60

# The balanced score of Delegated Agent Sessions (esoi/balance.py), measured on general tasks that are not coding (read files and report, compare, count,
# put in order): accuracy 70%, cost 15%, time 15%, the library's defaults. A task of this kind is worth at most ten cents and two minutes. The Claude Code runners
# run on a subscription: their dollars are the CLI's own estimate at list price, counted as cost here.
[balance.agent_sessions]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.10
seconds_per_case = 120

# The balanced score of the hard stage of Delegated Agent Sessions: real deep work (multi-file coding changes with hidden tests, milestone
# deliverables judged item by item), which takes minutes. Weights are the library's defaults. A task of this kind is worth at most a dollar
# and ten minutes, fixed before any arm was scored on these cases.
[balance.agent_sessions_hard]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 1.00
seconds_per_case = 600

# The balanced score of cards-from-files (esoi/balance.py). One case is finding the file one task needs, which is part of a
# small file edit (worth at most ten cents and a minute, [balance.file_edit_goals]) and what a worker without cards spends a
# few tool calls on, so a case is worth at most a fifth of an edit. One build serves every case of a run, so a card build of
# this corpus is worth at most the file-finding cases' budget. The weights and budgets were fixed before any arm was scored on the
# mixed set and are not tuned on its results: accuracy counts most because a wrong card costs the reader more than a build costs the
# team; cost and time are equal and small because a build is paid once per corpus. The case mix (file, topic, orientation) is
# evaluation/cards_from_files/mix.py and the store-size term is applied to the accuracy inside the scorer (score.store_penalty), since
# the library's balanced score has three terms.
[balance.cards_from_files]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.02
seconds_per_case = 12

# The balanced scores of the three cascades that pool several kinds of case into one component (esoi/balance.py, docs/how-to/
# write-a-cascade-that-stays-one-number.md). Weights are the library's defaults; the budgets say what one case is worth at most and are
# fixed before any arm is scored on the pooled set, not tuned on its results. The kinds of case (the-science: LitSearch questions;
# nervous-system: explicit and ambiguous step digests; context-assembler: public medical queries, title or sentence queries over a paper
# sample, paraphrased queries over the same sample) are case sources of one component each, mixed by the table in the component's own
# mix module, never separate stages or leaderboards.
#
# the-science: one paper lookup is worth at most a cent and half a minute; the paid arms spend about a hundredth of that in money
# and a few seconds.
[balance.know_the_world]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.01
seconds_per_case = 30

# nervous-system: the check runs before steps of a run, so one verdict is worth at most half a cent and ten seconds.
[balance.watch_for_risk]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.005
seconds_per_case = 10

# prioritization: ordering what competes for attention is a few comparisons in code and runs before every unasked pass, so one ordering is worth at most a tenth of a cent and one
# second. The weights are the library's defaults and the budgets were fixed before any arm was scored on the cases of evaluation/prioritization/build_cases.py.
[balance.prioritization]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.001
seconds_per_case = 1

# terminal-session: one scripted session is a handful of lines through a stub front door in memory, so a session is worth at most a tenth of a cent and one second. The weights
# are the library's defaults and the budgets were fixed before any arm was scored on the cases of evaluation/terminal_session/build_cases.py.
[balance.terminal_session]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.001
seconds_per_case = 1

# frontend-interface: one case is a few events turned to plain data in memory, so a case is worth at most a tenth of a cent and one second. The weights are the library's defaults and
# the budgets were fixed before any arm was scored on the cases of evaluation/frontend_interface/build_cases.py.
[balance.frontend_interface]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.001
seconds_per_case = 1

# structure-in-view: one case arranges a handful of events and reads a few rows of records in memory, so a case is worth at most a tenth of a cent and one second. The weights are the
# library's defaults and the budgets were fixed before any arm was scored on the cases of evaluation/structure_in_view/build_cases.py.
[balance.structure_in_view]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.001
seconds_per_case = 1

# critical-thinking: one scripted pursuit is a few stub calls in memory, so a pursuit is worth at most a tenth of a cent and one second. The weights are the library's defaults and the
# budgets were fixed before any arm was scored on the cases of evaluation/critical_thinking/build_cases.py.
[balance.critical_thinking]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.001
seconds_per_case = 1

# goal-completion: a verdict on one outcome, or a stop decision on one iteration history, is a few comparisons in code, so one case is worth at most a tenth of a cent and one second.
# The weights are the library's defaults and the budgets were fixed before any arm was scored on the cases of evaluation/goal_completion/build_cases.py; the penalties of the stop
# stage (over-iteration, premature stop and wrong ask 1.0, right action with the wrong kind of stop 0.5) are fixed in evaluation/goal_completion/score.py and recorded in metrics.csv.
[balance.goal_completion]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.001
seconds_per_case = 1

# response-quality: judging one response is a few regular expressions over its text, so a judgment is worth at most a tenth of a cent and one second. The weights are the library's
# defaults and the budgets were fixed before any arm was scored on the cases of evaluation/response_quality/build_cases.py.
[balance.response_quality]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.001
seconds_per_case = 1

# guidance: deciding whether and what to nudge is a few string checks in code before a reply is planned, so one decision is worth at most a tenth of a cent and one second.
# The weights are the library's defaults and the budgets were fixed before any arm was scored on the cases of evaluation/guidance/build_cases.py.
[balance.guidance]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.001
seconds_per_case = 1

# context-assembler: one retrieval runs per query and its embedding is the only money spent, so a query is worth at most half a cent and
# five seconds.
[balance.context_assembler]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.005
seconds_per_case = 5

# long-term-memory: one recall runs before a request is planned over a person's own items, in code, so a recall is worth at most a tenth of a cent and one second. The weights
# are the library's defaults and the budgets were fixed before any arm was scored on the cases of evaluation/long_term_memory/build_cases.py.
[balance.long_term_memory]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.001
seconds_per_case = 1

# Opt-in rules (esoi/docs): S36 the overall network on the root solution, S37 every id has an interface and a one-line entry,
# S38 the paragraph and diagram match the code, S39 the ratchet against the base commit. S38 floors are per intent, set at the measured values.
[rules.S36]
enabled = true

[rules.S37]
enabled = true

[rules.S38]
enabled = true

# Coverage is the share of an intent's uses edges whose two ends both have code. The flow of every container is code now (the composition arms
# in hubofhubs/flows.py, whole.py and areas.py), and the parts they call that have no arm yet are not edges of the same kind; each floor is the
# measured value. The Consciousness intent has no edge between its own parts yet (all its parts are specifications), so it has no floor.
[rules.S38.floors.hub-of-hubs]
precision = 1.0
coverage = 1.0

[rules.S38.floors.the_self]
precision = 1.0
coverage = 0.66

[rules.S38.floors.the_body]
precision = 1.0
coverage = 0.75

[rules.S38.floors.the_intelligence]
precision = 1.0
coverage = 0.42

[rules.S38.floors.the_world]
precision = 1.0
coverage = 0.93

[rules.S39]
enabled = true

# context-retrieval: one retrieval is worth at most half a cent and two seconds (a keyword search costs nothing and a local embedding of the
# query a few hundredths of a second; a model reranker costs a few tenths of a cent and a few seconds). The weights are the library's defaults,
# fixed with the budgets before any arm was scored on the mix of evaluation/context_retrieval/mix.py; the store size is a term of the accuracy
# (score.store_penalty), as in cards-from-files, because the library's balanced score has three terms.
[balance.context_retrieval]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.005
seconds_per_case = 2

# live-objectives: rolling up a hierarchy and placing a request are string and arithmetic work in code that runs once per request, so one answer is worth at most a tenth of a cent
# and one second. The weights are the library's defaults and the budgets were fixed before any arm was scored on the cases of evaluation/live_objectives/build_cases.py.
[balance.live_objectives]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.001
seconds_per_case = 1

# role-understanding: stating a part's role is a read of the records and a scan of its code, run whenever a flow asks what a part is for, so one statement is worth at most a
# tenth of a cent and one second. The weights are the library's defaults and the budgets were fixed before any arm was scored on the cases of evaluation/role_understanding/build_cases.py.
[balance.role_understanding]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.001
seconds_per_case = 1

# The balanced score of Relevant Solutions (which of the hub's solutions a request concerns): the library's numbers for Solution Relevance, fixed
# before any hub arm was scored. One classification runs before each fan-out of passes, so it is worth at most a fifth of a cent and two seconds.
[balance.relevant_solutions]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.002
seconds_per_case = 2

# The balanced score of Folder View (which files of a working folder a piece of work is shown, and which folders are left out): the library's default weights,
# fixed before any arm was scored on the cases of evaluation/folder_view/build_cases.py. One choice runs before each run of a harness and scans a folder of up to a
# few thousand files, so it is worth at most a fifth of a cent and five seconds (the scoring time includes building the case's folder).
[balance.folder_view]
weights = { accuracy = 0.70, cost = 0.15, time = 0.15 }
cost_per_case_usd = 0.002
seconds_per_case = 5

# Relevant Solutions builds on the library's Solution Relevance: its general cases are the foundation and the hub's own cases (mined from this
# repository's history and hand-labelled requests) are added.
[builds_on.relevant_solutions.esoi]
repo = "../evolvable-structure"
component = "solution_relevance"
share = 0.50
