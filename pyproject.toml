[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hub-of-hubs-structure"
version = "0.1.0"
description = "A registry of the best AI-intelligence hubs and the scorer that reads it with a consumer's code"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools]
packages = ["ai_hub_of_hubs"]

[tool.setuptools.package-data]
ai_hub_of_hubs = ["registry/*.csv", "examples/*.toml"]
