[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hubofhubs"
version = "0.1.0"
description = "A registry of the best AI-intelligence hubs and the scorer that reads it with a consumer's code"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["esoi"]

[project.optional-dependencies]
# One extra per arm that needs a third-party library; the library is imported lazily, only when that arm runs.
web = ["httpx"]                      # search-backend arms: serper, brave, tavily, searxng, gemini (redirect links), page fetching
gemini = ["google-genai", "httpx"]   # search-backend arm: gemini; call-a-model arm: gemini
locks = ["filelock"]                 # search-backend arm: the daily limiter shares one spend across processes (degrades to per-process without it)
anthropic = ["anthropic"]               # call-a-model arm: anthropic
openai = ["openai"]                   # call-a-model arms: openai, deepseek (an OpenAI-compatible endpoint)
mcp = ["mcp==2.0.0"]                # act-in-the-world helper: the MCP protocol client (the arms over it live in the consumer)
science = ["httpx"]                 # know-the-world arm: openalex (scholarly works search); the Crossref DOI helper
pages = ["trafilatura", "pypdf"]     # page extraction and PDF text (both optional; the code degrades honestly without them)
qdrant = ["qdrant-client", "fastembed"]   # remember-and-recall: the Qdrant vector store (embedded or server) and its local default embedder
voyage = ["voyageai"]                # remember-and-recall: the Voyage AI embedder factory
acp = ["agent-client-protocol"]      # act-in-the-world arm: the Agent Client Protocol deep runner (imported inside one function)
bm25 = ["bm25s"]                     # remember-and-recall: the BM25 content store

[tool.setuptools]
packages = ["hubofhubs", "hubofhubs.act", "hubofhubs.critique", "hubofhubs.deep", "hubofhubs.models", "hubofhubs.orchestrate", "hubofhubs.ports", "hubofhubs.recall", "hubofhubs.science", "hubofhubs.websearch"]

[tool.setuptools.package-data]
hubofhubs = ["registry/*.csv", "examples/*.toml", "esoi_selection.json"]
