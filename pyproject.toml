[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hubofhubs"
version = "0.7.2"
description = "A registry of the best AI-intelligence hubs and the scorer that reads it with a consumer's code"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# The base install carries esoi and every library the selected arm of every solution imports (derived by scripts/sync_dependencies.py from the
# arms' REQUIRES; never edit between the markers). The extras below stay for the alternatives that are not selected.
dependencies = [
    "esoi @ git+https://github.com/JoshuaMathias/evolvable-structure.git@v0.7.0#subdirectory=implementations/python",
    # selected-arms:start (generated by scripts/sync_dependencies.py)
    "google-genai>=2.8",
    "httpx>=0.28",
    # selected-arms:end
]

[project.scripts]
ahohs = "hubofhubs.the_self.assembler.cli:main"

[project.optional-dependencies]
# One extra per arm that needs a third-party library; the library is imported lazily, only when that arm runs.
web = ["httpx>=0.28"]                      # web-search arms: serper, brave, tavily, searxng, gemini (redirect links), page fetching
gemini = ["google-genai>=2.8", "httpx>=0.28"]   # web-search arm: gemini; vendor-model-caller arm: gemini
locks = ["filelock>=3.20"]                 # web-search arm: the daily limiter shares one spend across processes (degrades to per-process without it)
anthropic = ["anthropic>=0.84"]               # vendor-model-caller arm: anthropic
openai = ["openai>=2.7"]                   # vendor-model-caller arms: openai, deepseek (an OpenAI-compatible endpoint)
mcp = ["mcp==2.0.0"]                # connected-system-operations helper: the MCP protocol client (the arms over it live in the consumer)
science = ["httpx>=0.28"]                 # the-science arm: openalex (scholarly works search); the Crossref DOI helper
pages = ["trafilatura>=2.0", "pypdf>=6.0"]     # page extraction and PDF text (both optional; the code degrades honestly without them)
qdrant = ["qdrant-client>=1.16", "fastembed>=0.8"]   # the-subconscious: the Qdrant vector store (embedded or server) and its local default embedder
voyage = ["voyageai>=0.3"]                # the-subconscious: the Voyage AI embedder factory
evaluation = ["pyte>=0.8.2"]              # evaluation only, never imported by the package: the terminal emulator (LGPL-3.0) that evaluation/terminal_presentation replays screens through (tested with 0.8.2)
acp = ["agent-client-protocol>=1.0"]      # (floor raised to 1.0, the version `ahohs acp` and its tests ran on) delegated-agent-sessions arm: the Agent Client Protocol deep runner, and `ahohs acp` (the hub served as an ACP agent, arm terminal-session:acp_client_session); imported inside functions
bm25 = ["bm25s>=0.3", "PyStemmer>=3.0"]                     # the-subconscious: the BM25 content store
retrieval = ["numpy>=1.26", "scikit-learn>=1.4", "fastembed>=0.8"]   # context-retriever: the dense arm (a local embedding model), the latent semantic index and the learned reranker
textual = ["textual>=8.0"]                                   # terminal-session arm: textual_session (a full-screen terminal; rich, its dependency, renders the markdown)
adopted_ui = ["textual>=8.0", "pydantic>=2.7"]             # terminal-session arm: adopted_session (the vendored Mistral Vibe v2.26.1 interface; needs Python 3.12 or later, its typed entries are pydantic models)
graphify = ["graphifyy==0.9.102"]                           # cards-from-files: the graphify_files builder (code-only extraction, no model)

[tool.setuptools.packages.find]
include = ["hubofhubs*"]
exclude = ["hubofhubs*.tests", "hubofhubs*.tests.*"]   # tests sit beside the code they test and are not shipped

[tool.pytest.ini_options]
testpaths = ["tests", "hubofhubs"]
python_files = ["test_*.py"]

[tool.setuptools.package-data]
hubofhubs = ["the_consciousness/ai_session_experience/opencode_server/plugin/hub_session/tui.tsx", "registry/*.csv", "esoi_selection.json", "arm_order.json", "the_world/model_plumbing/model_tier_chooser/role_tiers.csv", "the_world/model_plumbing/model_tier_chooser/role_tier_metrics.csv", "the_world/model_plumbing/model_tier_chooser/tier_metrics.csv"]
